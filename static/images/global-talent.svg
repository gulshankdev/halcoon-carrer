<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="globeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101E"/>
      <stop offset="60%" stop-color="#142B4A"/>
      <stop offset="100%" stop-color="#0F9D95"/>
    </linearGradient>
    <linearGradient id="globeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="globeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#globeBg)"/>

  <!-- World Globe Network Mesh -->
  <g transform="translate(600, 360)">
    <!-- Concentric Latitude & Longitude Ellipses -->
    <circle cx="0" cy="0" r="240" fill="none" stroke="rgba(15,157,149,0.25)" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="240" ry="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="240" ry="60" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="140" ry="240" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="60" ry="240" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Orbital flight lines -->
    <path d="M -220 -80 Q 0 -260, 210 -70" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-dasharray="8,6"/>
    <path d="M -180 120 Q 0 240, 220 80" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="8,6"/>

    <!-- Network Hub Nodes -->
    <!-- Mohali HQ -->
    <circle cx="20" cy="-30" r="14" fill="#0F9D95" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="20" cy="-30" r="26" fill="none" stroke="#0F9D95" opacity="0.6" stroke-width="1.5"/>
    <text x="38" y="-35" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="14">MOHALI HQ</text>

    <!-- Bangalore -->
    <circle cx="50" cy="80" r="10" fill="#2DD4BF" stroke="#FFFFFF" stroke-width="2"/>
    <text x="68" y="85" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Bangalore Tech Hub</text>

    <!-- NCR Delhi -->
    <circle cx="0" cy="-60" r="10" fill="#2DD4BF" stroke="#FFFFFF" stroke-width="2"/>
    <text x="-120" y="-70" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Delhi NCR Hub</text>

    <!-- Mumbai -->
    <circle cx="-60" cy="30" r="10" fill="#2DD4BF" stroke="#FFFFFF" stroke-width="2"/>
    <text x="-160" y="45" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Mumbai Finance</text>

    <!-- Hyderabad -->
    <circle cx="10" cy="60" r="9" fill="#2DD4BF" stroke="#FFFFFF" stroke-width="2"/>
    <text x="-90" y="90" fill="#E2E8F0" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Hyderabad</text>
  </g>

  <!-- Top Glass Banner -->
  <g transform="translate(150, 50)" filter="url(#globeShadow)">
    <rect width="900" height="90" rx="20" fill="rgba(20,43,74,0.85)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="35" y="45" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="22">PAN-INDIA &amp; GLOBAL TALENT SOURCING NETWORK</text>
    <text x="35" y="70" fill="#2DD4BF" font-family="'Inter', sans-serif" font-weight="600" font-size="14">Connecting Premier Employers with Elite Professionals Across 28+ Tech &amp; Corporate Corridors</text>
  </g>

  <!-- Bottom Stats Badges -->
  <g transform="translate(150, 550)">
    <rect x="0" y="0" width="280" height="75" rx="16" fill="rgba(20,43,74,0.9)" stroke="#0F9D95" stroke-width="1.5"/>
    <text x="25" y="32" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">GEOGRAPHIC REACH</text>
    <text x="25" y="58" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="20" font-weight="800">50+ Tier 1 &amp; 2 Cities</text>

    <rect x="310" y="0" width="280" height="75" rx="16" fill="rgba(20,43,74,0.9)" stroke="#2DD4BF" stroke-width="1.5"/>
    <text x="335" y="32" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">TALENT DATABASE</text>
    <text x="335" y="58" fill="#2DD4BF" font-family="'Inter', sans-serif" font-size="20" font-weight="800">350,000+ Pre-Vetted</text>

    <rect x="620" y="0" width="280" height="75" rx="16" fill="rgba(20,43,74,0.9)" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="645" y="32" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">CROSS-BORDER COMPLIANCE</text>
    <text x="645" y="58" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="20" font-weight="800">100% Verified</text>
  </g>
</svg>

