<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091424"/>
      <stop offset="50%" stop-color="#142B4A"/>
      <stop offset="100%" stop-color="#0F9D95"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15,157,149,0.25)"/>
      <stop offset="100%" stop-color="rgba(20,43,74,0.4)"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F9D95"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="180" fill="#0F9D95" opacity="0.18" filter="url(#blurGlow)"/>
  <circle cx="1050" cy="550" r="220" fill="#2DD4BF" opacity="0.15" filter="url(#blurGlow)"/>

  <!-- 3D Perspective Grid Lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.2">
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="570" x2="1200" y2="570"/>
    <line x1="0" y1="620" x2="1200" y2="620"/>
    <line x1="200" y1="480" x2="50" y2="675"/>
    <line x1="400" y1="480" x2="350" y2="675"/>
    <line x1="600" y1="480" x2="600" y2="675"/>
    <line x1="800" y1="480" x2="850" y2="675"/>
    <line x1="1000" y1="480" x2="1150" y2="675"/>
  </g>

  <!-- Central Dashboard Glass Card -->
  <rect x="240" y="80" width="720" height="500" rx="24" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" filter="url(#shadow3d)"/>

  <!-- Card Header Bar -->
  <rect x="240" y="80" width="720" height="64" rx="24" fill="rgba(20,43,74,0.6)"/>
  <circle cx="276" cy="112" r="7" fill="#EF4444"/>
  <circle cx="298" cy="112" r="7" fill="#F59E0B"/>
  <circle cx="320" cy="112" r="7" fill="#10B981"/>
  <text x="350" y="118" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="700" font-size="16" letter-spacing="0.5">HALCON WORKFORCE DEPLOYMENT PLATFORM</text>
  <rect x="830" y="96" width="105" height="32" rx="16" fill="rgba(15,157,149,0.3)" stroke="#0F9D95" stroke-width="1"/>
  <text x="848" y="117" fill="#2DD4BF" font-family="'Inter', sans-serif" font-weight="600" font-size="12">LIVE ENGINE</text>

  <!-- Analytics Metrics Row -->
  <g transform="translate(275, 175)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="195" height="100" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="18" y="32" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">VOLUME CAPACITY</text>
    <text x="18" y="68" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="28" font-weight="800">5,000+</text>
    <text x="18" y="88" fill="#2DD4BF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">↑ Monthly Screened</text>

    <!-- Metric 2 -->
    <rect x="225" y="0" width="195" height="100" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="243" y="32" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">MATCH ACCURACY</text>
    <text x="243" y="68" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="28" font-weight="800">98.4%</text>
    <text x="243" y="88" fill="#2DD4BF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Role Calibration Rate</text>

    <!-- Metric 3 -->
    <rect x="450" y="0" width="195" height="100" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="468" y="32" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="600">DEPLOYMENT SPEED</text>
    <text x="468" y="68" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="28" font-weight="800">48 Hrs</text>
    <text x="468" y="88" fill="#2DD4BF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Initial Talent Shortlist</text>
  </g>

  <!-- Workforce Node Map & Pipelines -->
  <g transform="translate(275, 305)">
    <!-- Chart Box -->
    <rect x="0" y="0" width="650" height="235" rx="16" fill="rgba(10,25,48,0.7)" stroke="rgba(255,255,255,0.1)"/>
    
    <!-- Pipeline Network Nodes -->
    <path d="M 60 140 Q 180 60, 320 120 T 580 80" fill="none" stroke="#0F9D95" stroke-width="3" stroke-dasharray="6,4"/>
    <path d="M 60 180 Q 200 190, 350 140 T 580 160" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>

    <!-- Nodes -->
    <circle cx="60" cy="140" r="10" fill="#142B4A" stroke="#0F9D95" stroke-width="3"/>
    <text x="40" y="170" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Source</text>

    <circle cx="200" cy="95" r="12" fill="#0F9D95" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="175" y="125" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Screening</text>

    <circle cx="340" cy="125" r="14" fill="#2DD4BF" stroke="#142B4A" stroke-width="3"/>
    <text x="315" y="155" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Evaluation</text>

    <circle cx="470" cy="100" r="12" fill="#0F9D95" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="445" y="130" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Calibration</text>

    <circle cx="580" cy="80" r="14" fill="#FFFFFF" stroke="#0F9D95" stroke-width="4"/>
    <text x="555" y="110" fill="#2DD4BF" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Placement</text>

    <!-- Sub-status badge -->
    <rect x="20" y="20" width="220" height="28" rx="8" fill="rgba(15,157,149,0.15)"/>
    <text x="32" y="38" fill="#2DD4BF" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Workforce Scalability Pipeline</text>
  </g>

  <!-- 3D Overlapping Accent Badge Top Right -->
  <g transform="translate(930, 110)" filter="url(#shadow3d)">
    <rect width="180" height="85" rx="16" fill="rgba(20,43,74,0.95)" stroke="#0F9D95" stroke-width="1.8"/>
    <circle cx="34" cy="42" r="18" fill="#0F9D95"/>
    <text x="28" y="47" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="16" font-weight="900">✓</text>
    <text x="64" y="38" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Verified</text>
    <text x="64" y="55" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Talent Pool</text>
  </g>

  <!-- 3D Accent Badge Bottom Left -->
  <g transform="translate(80, 470)" filter="url(#shadow3d)">
    <rect width="180" height="85" rx="16" fill="rgba(20,43,74,0.95)" stroke="#2DD4BF" stroke-width="1.8"/>
    <circle cx="34" cy="42" r="18" fill="#2DD4BF"/>
    <text x="28" y="48" fill="#142B4A" font-family="'Inter', sans-serif" font-size="18" font-weight="900">★</text>
    <text x="64" y="38" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Tricity Leader</text>
    <text x="64" y="55" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Mohali Campus</text>
  </g>
</svg>

