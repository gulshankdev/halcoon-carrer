<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091424"/>
      <stop offset="60%" stop-color="#142B4A"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="finCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="greenTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0F9D95"/>
    </linearGradient>
    <linearGradient id="candlestickGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F9D95"/>
    </linearGradient>
    <filter id="finGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
    </filter>
    <filter id="finShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#finBg)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="180" r="220" fill="#0F9D95" opacity="0.16" filter="url(#finGlow)"/>
  <circle cx="200" cy="500" r="190" fill="#10B981" opacity="0.12" filter="url(#finGlow)"/>

  <!-- Grid mesh background -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Main Glass Card: Financial & Analytical Talent Matrix -->
  <rect x="180" y="70" width="840" height="520" rx="24" fill="url(#finCardGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" filter="url(#finShadow)"/>

  <!-- Top Glass Header -->
  <rect x="180" y="70" width="840" height="70" rx="24" fill="rgba(20,43,74,0.65)"/>
  <text x="220" y="112" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="18" letter-spacing="0.5">FINANCIAL &amp; ANALYTICAL SEARCH</text>
  <rect x="800" y="88" width="180" height="34" rx="17" fill="rgba(16,185,129,0.18)" stroke="#10B981" stroke-width="1"/>
  <text x="822" y="110" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="12">CAPITAL &amp; RISK HIRING</text>

  <!-- 3D Bar & Candlestick Growth Chart -->
  <g transform="translate(220, 180)">
    <!-- Chart Container -->
    <rect x="0" y="0" width="500" height="370" rx="16" fill="rgba(10,25,48,0.7)" stroke="rgba(255,255,255,0.1)"/>
    <text x="25" y="38" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Senior Financial Analyst Placements (Q1-Q4)</text>

    <!-- Chart Grid Lines -->
    <line x1="50" y1="80" x2="460" y2="80" stroke="rgba(255,255,255,0.08)" stroke-dasharray="4,4"/>
    <line x1="50" y1="150" x2="460" y2="150" stroke="rgba(255,255,255,0.08)" stroke-dasharray="4,4"/>
    <line x1="50" y1="220" x2="460" y2="220" stroke="rgba(255,255,255,0.08)" stroke-dasharray="4,4"/>
    <line x1="50" y1="290" x2="460" y2="290" stroke="rgba(255,255,255,0.15)"/>

    <!-- Candlestick bars -->
    <g transform="translate(70, 0)">
      <line x1="20" y1="180" x2="20" y2="290" stroke="#0F9D95" stroke-width="2"/>
      <rect x="8" y="210" width="24" height="70" rx="4" fill="url(#candlestickGreen)"/>
      <text x="10" y="315" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Q1</text>
    </g>

    <g transform="translate(160, 0)">
      <line x1="20" y1="140" x2="20" y2="290" stroke="#0F9D95" stroke-width="2"/>
      <rect x="8" y="170" width="24" height="100" rx="4" fill="url(#candlestickGreen)"/>
      <text x="10" y="315" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Q2</text>
    </g>

    <g transform="translate(250, 0)">
      <line x1="20" y1="100" x2="20" y2="290" stroke="#2DD4BF" stroke-width="2"/>
      <rect x="8" y="130" width="24" height="130" rx="4" fill="url(#candlestickGreen)"/>
      <text x="10" y="315" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Q3</text>
    </g>

    <g transform="translate(340, 0)">
      <line x1="20" y1="70" x2="20" y2="290" stroke="#34D399" stroke-width="2"/>
      <rect x="8" y="90" width="24" height="170" rx="4" fill="url(#candlestickGreen)"/>
      <text x="10" y="315" fill="#34D399" font-family="'Inter', sans-serif" font-weight="700" font-size="11">Q4</text>
    </g>

    <!-- Upward Trendline -->
    <path d="M 88 230 C 180 200, 270 140, 360 100" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="360" cy="100" r="6" fill="#F59E0B"/>
    <text x="375" y="95" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="12" font-weight="800">+142% Growth</text>
  </g>

  <!-- Side Metrics Column -->
  <g transform="translate(745, 180)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="245" height="105" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="18" y="30" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">MEDIAN CTC CALIBRATION</text>
    <text x="18" y="66" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="24" font-weight="800">₹14 - 36 LPA</text>
    <text x="18" y="88" fill="#2DD4BF" font-family="'Inter', sans-serif" font-size="11">Chartered Accountants &amp; CFAs</text>

    <!-- Card 2 -->
    <rect x="0" y="125" width="245" height="105" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="18" y="155" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">OFFER CONVERSION RATE</text>
    <text x="18" y="191" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="24" font-weight="800">94.8%</text>
    <text x="18" y="213" fill="#34D399" font-family="'Inter', sans-serif" font-size="11">Tier-1 Banking Partnerships</text>

    <!-- Card 3 -->
    <rect x="0" y="250" width="245" height="100" rx="14" fill="rgba(15,157,149,0.18)" stroke="#0F9D95" stroke-width="1.2"/>
    <text x="18" y="280" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Audit &amp; Risk Officers</text>
    <text x="18" y="305" fill="#D1D5DB" font-family="'Inter', sans-serif" font-size="12">100% Background-Screened</text>
    <text x="18" y="328" fill="#2DD4BF" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Fast-Track Onboarding →</text>
  </g>
</svg>

