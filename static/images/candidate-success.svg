<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="succBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081424"/>
      <stop offset="50%" stop-color="#142B4A"/>
      <stop offset="100%" stop-color="#0F9D95"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0F9D95"/>
    </linearGradient>
    <filter id="succShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#succBg)"/>

  <!-- Confetti / Ambient Particle Flares -->
  <g opacity="0.3">
    <circle cx="200" cy="180" r="6" fill="#FBBF24"/>
    <circle cx="280" cy="120" r="4" fill="#2DD4BF"/>
    <circle cx="340" cy="220" r="5" fill="#FFFFFF"/>
    <circle cx="860" cy="140" r="5" fill="#FBBF24"/>
    <circle cx="940" cy="220" r="6" fill="#2DD4BF"/>
    <circle cx="1020" cy="160" r="4" fill="#FFFFFF"/>
    <polygon points="180,260 190,275 170,275" fill="#34D399"/>
    <polygon points="980,280 990,295 970,295" fill="#FBBF24"/>
  </g>

  <!-- Top Glass Banner -->
  <g transform="translate(180, 50)" filter="url(#succShadow)">
    <rect width="840" height="85" rx="20" fill="rgba(20,43,74,0.9)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="35" y="42" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="22">CANDIDATE CAREER ACCELERATION &amp; SUCCESS</text>
    <text x="35" y="68" fill="#34D399" font-family="'Inter', sans-serif" font-weight="600" font-size="13">Empowering Thousands of Professionals Across Tricity &amp; Pan-India to Reach Their Potential</text>
  </g>

  <!-- Center: Job Offer Acceptance Letter Card (3D Isometric Glass) -->
  <g transform="translate(380, 170)" filter="url(#succShadow)">
    <rect width="440" height="380" rx="20" fill="rgba(255,255,255,0.96)" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Letterhead -->
    <rect width="440" height="75" rx="20" fill="#142B4A"/>
    <!-- Overwrite bottom rounded corners of header -->
    <rect y="55" width="440" height="20" fill="#142B4A"/>
    
    <text x="30" y="42" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="16">HALCON CAREER</text>
    <text x="30" y="60" fill="#2DD4BF" font-family="'Inter', sans-serif" font-weight="600" font-size="11">OFFICIAL PLACEMENT CONFIRMATION</text>
    <rect x="330" y="24" width="80" height="28" rx="14" fill="#10B981"/>
    <text x="370" y="42" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="11" text-anchor="middle">OFFER ISSUED</text>

    <!-- Content details inside offer letter -->
    <text x="30" y="115" fill="#1E293B" font-family="'Inter', sans-serif" font-weight="700" font-size="16">Dear Selected Candidate,</text>
    <text x="30" y="142" fill="#475569" font-family="'Inter', sans-serif" font-size="12" line-height="1.5">We are delighted to congratulate you on your formal appointment as</text>
    <text x="30" y="165" fill="#0F9D95" font-family="'Inter', sans-serif" font-weight="800" font-size="15">Senior Engineering Specialist</text>
    
    <line x1="30" y1="185" x2="410" y2="185" stroke="#E2E8F0"/>

    <text x="30" y="215" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="600">COMPENSATION PACKAGE</text>
    <text x="30" y="240" fill="#0F172A" font-family="'Inter', sans-serif" font-size="20" font-weight="800">Competitive Industry Grade</text>

    <text x="240" y="215" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="600">LOCATION</text>
    <text x="240" y="240" fill="#0F172A" font-family="'Inter', sans-serif" font-size="15" font-weight="700">Mohali / Hybrid</text>

    <!-- Verification Stamp -->
    <g transform="translate(290, 270)">
      <circle cx="60" cy="40" r="40" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6,3"/>
      <circle cx="60" cy="40" r="32" fill="rgba(16,185,129,0.1)"/>
      <text x="60" y="38" fill="#10B981" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">HALCON CAREER</text>
      <text x="60" y="52" fill="#10B981" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle">VERIFIED</text>
    </g>

    <!-- Candidate signature placeholder -->
    <path d="M 40 325 Q 70 295, 110 320 T 170 305" fill="none" stroke="#1E3F6C" stroke-width="2"/>
    <text x="40" y="345" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Candidate Acceptance Signature</text>
  </g>

  <!-- Left Stats Badge -->
  <g transform="translate(100, 280)" filter="url(#succShadow)">
    <rect width="230" height="95" rx="16" fill="rgba(20,43,74,0.95)" stroke="#10B981" stroke-width="1.5"/>
    <text x="22" y="32" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">PLACEMENT HAPPINESS</text>
    <text x="22" y="65" fill="#34D399" font-family="'Inter', sans-serif" font-size="24" font-weight="800">99.1% Positive</text>
    <text x="22" y="84" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">Candidate Feedback</text>
  </g>

  <!-- Right Stats Badge -->
  <g transform="translate(870, 280)" filter="url(#succShadow)">
    <rect width="230" height="95" rx="16" fill="rgba(20,43,74,0.95)" stroke="#2DD4BF" stroke-width="1.5"/>
    <text x="22" y="32" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">ZERO HIDDEN CHARGES</text>
    <text x="22" y="65" fill="#2DD4BF" font-family="'Inter', sans-serif" font-size="24" font-weight="800">100% Free</text>
    <text x="22" y="84" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">For All Candidates Always</text>
  </g>
</svg>

