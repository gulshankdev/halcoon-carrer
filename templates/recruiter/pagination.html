{% if page_obj.has_other_pages %}
<nav aria-label="Dashboard pagination" class="mt-3">
  <ul class="pagination pagination-sm justify-content-end mb-0">
    {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if pagination_query %}&{{ pagination_query }}{% endif %}">Previous</a></li>{% endif %}
    <li class="page-item disabled"><span class="page-link">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{% if pagination_query %}&{{ pagination_query }}{% endif %}">Next</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
