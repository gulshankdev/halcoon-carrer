{% extends 'base.html' %}

{% block title %}Reset Link Dispatched | HALCON CAREER{% endblock %}

{% block content %}
<div class="py-5 bg-white text-center">
  <div class="container" style="max-width: 480px;">
    <div class="card-custom p-4 p-md-5 border shadow-sm">
      <div class="service-icon-box mx-auto mb-3" style="width: 56px; height: 56px;">
        <i class="bi bi-envelope-check"></i>
      </div>
      <h3 class="fw-bold mb-2 text-dark">Check Your Inbox</h3>
      <p class="text-muted small mb-4">
        If an account exists with the email address you entered, we have sent instructions for resetting your password.
      </p>
      <a href="{% url 'accounts:login' %}" class="btn btn-teal w-100">Return to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
