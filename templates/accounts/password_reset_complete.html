{% extends 'base.html' %}

{% block title %}Password Reset Complete | HALCON CAREER{% endblock %}

{% block content %}
<div class="py-5 bg-white text-center">
  <div class="container" style="max-width: 480px;">
    <div class="card-custom p-4 p-md-5 border shadow-sm">
      <div class="service-icon-box mx-auto mb-3" style="width: 56px; height: 56px; background-color: #ECFDF3; color: #039855;">
        <i class="bi bi-shield-check"></i>
      </div>
      <h3 class="fw-bold mb-2 text-dark">Password Reset Complete</h3>
      <p class="text-muted small mb-4">Your password has been successfully reset. You may now sign in with your new credentials.</p>
      <a href="{% url 'accounts:login' %}" class="btn btn-teal w-100">Sign In Now</a>
    </div>
  </div>
</div>
{% endblock %}
