{% extends 'base.html' %}

{% block title %}Password Changed Successfully | HALCON CAREER{% endblock %}

{% block content %}
<div class="py-5 bg-white text-center">
  <div class="container" style="max-width: 480px;">
    <div class="card-custom p-4 p-md-5 border shadow-sm">
      <div class="service-icon-box mx-auto mb-3" style="width: 56px; height: 56px; background-color: #ECFDF3; color: #039855;">
        <i class="bi bi-check2-circle"></i>

      <a href="{% url 'accounts:profile' %}" class="btn btn-teal w-100">Back to Profile</a>
    </div>
  </div>

{% endblock %}
