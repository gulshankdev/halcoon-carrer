{% extends 'base.html' %}

{% block title %}Internal Server Error (500) | HALCON CAREER{% endblock %}

{% block content %}
<div class="container section-py text-center" style="max-width: 600px;">
  <div class="service-icon-box mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2rem; background-color: #FEF3F2; color: #D92D20;">
    <i class="bi bi-gear-fill"></i>
  </div>
  <h1 class="fw-bold mb-2 display-6">Server Error</h1>
  <p class="text-muted mb-4">
    An unexpected error occurred while processing your request. Our technical team has been notified.
  </p>
  <div class="d-flex justify-content-center gap-2">
    <a href="{% url 'core:home' %}" class="btn btn-teal">
      <i class="bi bi-house me-1"></i> Return to Homepage
    </a>
    <a href="tel:{{ COMPANY_PHONE_PRIMARY }}" class="btn btn-outline-custom">
      <i class="bi bi-telephone me-1"></i> Contact Desk
    </a>
  </div>
</div>
{% endblock %}
