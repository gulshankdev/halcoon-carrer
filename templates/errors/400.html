{% extends 'base.html' %}

{% block title %}Bad Request (400) | HALCON CAREER{% endblock %}

{% block content %}
<div class="container section-py text-center" style="max-width: 600px;">
  <div class="service-icon-box mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2rem; background-color: #FEF3F2; color: #D92D20;">
    <i class="bi bi-x-octagon-fill"></i>
  </div>
  <h1 class="fw-bold mb-2 display-6">Bad Request</h1>
  <p class="text-muted mb-4">
    The server was unable to understand your request. Please verify the URL parameters or form submission.
  </p>
  <div class="d-flex justify-content-center gap-2">
    <a href="{% url 'core:home' %}" class="btn btn-teal">
      <i class="bi bi-house me-1"></i> Return to Homepage
    </a>
  </div>
</div>
{% endblock %}
