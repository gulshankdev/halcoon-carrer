{% extends 'base.html' %}

{% block title %}Page Not Found (404) | HALCON CAREER{% endblock %}

{% block content %}
<div class="container section-py text-center" style="max-width: 600px;">
  <div class="service-icon-box mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2rem; background-color: #FEF3F2; color: #D92D20;">
    <i class="bi bi-exclamation-triangle-fill"></i>
  </div>
  <h1 class="fw-bold mb-2 display-6">Page Not Found</h1>
  <p class="text-muted mb-4">
    The page or job vacancy you are looking for may have been removed, archived, or had its address modified.
  </p>
  <div class="d-flex justify-content-center gap-2">
    <a href="{% url 'jobs:job_list' %}" class="btn btn-teal">
      <i class="bi bi-search me-1"></i> Browse Vacancies
    </a>
    <a href="{% url 'core:home' %}" class="btn btn-outline-custom">
      <i class="bi bi-house me-1"></i> Go to Homepage
    </a>
  </div>
</div>
{% endblock %}
